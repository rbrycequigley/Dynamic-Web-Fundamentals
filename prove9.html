<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="prove9.js" defer></script>
    <link rel="stylesheet" href="prove9.css">
</head>
<body>
    <div class="site-header">
    <img id="companyLogo" src="recipe-book.png" alt="RecipeBook logo">
    <h1 id="title">RECIPEBOOK</h1>
</div>

    <div class="search-container">
        <input
            type="text"
            id="searchBar"
            placeholder="Search recipes..."
            aria-label="Search recipes"
        >
    <button id="searchButton">
        <img id="seachIcon" src="https://wddbyui.github.io/wdd131/images/recipe1/search.svg" alt="search icon">
    </button>
    </div>

    <hr>

    <div class="recipe">
        <img src="apple-crisp.jpg" alt="instagram icon">
        <button id="button">dessert</button>
        <h1>Apple Crisp</h1>
        <span
            class="rating"
            role="img"
            aria-label="Rating: 4 out of 5 stars"
            >
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
        </span>
        <p class="longText">
            This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.
        </p>
    </div>
    
    <footer>     
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="instagram icon"><img src="https://wddbyui.github.io/wdd131/images/recipe1/instagram_icon.svg" alt="instagram icon"></a>
            <a href="youtube icon"><img src="https://wddbyui.github.io/wdd131/images/recipe1/youtube_icon.svg" alt="youtube icon"></a>
            <a href="printrist icon"><img src="https://wddbyui.github.io/wdd131/images/recipe1/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>  
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>
    </footer>
</body>
</html>
